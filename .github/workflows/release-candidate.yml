name: Release candidate (manual)

# Never runs on pull_request, push or workflow_run. Merge alone publishes nothing.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character current main SHA with green CI and Container smoke
        required: true
        type: string
      confirm:
        description: Type PUBLISH_PRIVATE_IMAGES after checking Actions quota and private GHCR access
        required: true
        type: string

permissions: {}
concurrency:
  group: citygo-private-release-candidate
  cancel-in-progress: false

jobs:
  publish-candidate:
    if: >-
      github.repository == 'CityGo-Tech/citygo-platform' &&
      github.ref == 'refs/heads/main' &&
      vars.CITYGO_RELEASE_PUBLISH_ENABLED == 'true' &&
      inputs.confirm == 'PUBLISH_PRIVATE_IMAGES'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PUBLISH_CONFIRM: ${{ inputs.confirm }}
      RELEASE_ENABLED: ${{ vars.CITYGO_RELEASE_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify explicit source, green main checks and private packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs gate
      - name: Test release guards without publication
        run: node --test scripts/release-candidate.test.mjs
      - name: Install disposable encryption test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y age
      - name: Pin public base images for this candidate
        run: node scripts/release-candidate.mjs prepare
      - name: Build and test exact candidate images with synthetic data
        run: node scripts/container-smoke.mjs --disposable --release-candidate
      - name: Rehearse publisher on loopback before external publication
        run: node scripts/registry-smoke.mjs --disposable
      - name: Recheck gates, publish privately and read back exact digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs publish
      - name: Save candidate manifest and allowlisted runtime files (not secrets)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: citygo-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release-candidate/bundle/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

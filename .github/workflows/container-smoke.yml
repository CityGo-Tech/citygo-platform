name: Container smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify isolated production images with synthetic PostgreSQL
        run: node scripts/container-smoke.mjs --disposable
        # No registry push, deployment access, provider credentials or live model calls.

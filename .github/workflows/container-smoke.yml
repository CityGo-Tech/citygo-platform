name: Container smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install encryption tool on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y age
          age --version
      - name: Verify backup failure handling without cloud access
        run: python3 -B -m unittest discover -s deploy/backup -p 'test_*.py' -v
      - name: Verify release guards without publication
        run: node --test scripts/release-candidate.test.mjs
      - name: Pin public bases for disposable candidate rehearsal
        run: node scripts/release-candidate.mjs prepare
      - name: Verify isolated production images with synthetic PostgreSQL
        run: node scripts/container-smoke.mjs --disposable --release-candidate
      - name: Rehearse publisher against disposable loopback registry
        run: node scripts/registry-smoke.mjs --disposable
        # No external publication, deployment access, provider credentials or live model calls.

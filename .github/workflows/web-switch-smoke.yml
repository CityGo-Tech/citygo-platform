name: Web switch rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/web-switch-smoke.yml
      - deploy/backup/*web_switch*.py
      - deploy/backup/*web_bootstrap*.py
      - deploy/backup/*web_controller_install*.py
      - deploy/backup/*web_runtime_stage*.py
      - deploy/nginx/pilot-web-switch.conf.template
      - deploy/render-web-switch.mjs
      - deploy/fixtures/web-switch-*.mjs
      - deploy/fixtures/web-switch-*.py
      - deploy/fixtures/web-runtime-stage-*.py
      - deploy/fixtures/web-switch-*.Dockerfile
      - scripts/web-switch-*.mjs
      - scripts/web-runtime-stage-*.mjs
      - scripts/web-bootstrap-*.mjs
      - docs/runbooks/web-switch-bootstrap.md
      - docs/runbooks/web-bootstrap-draft.md
      - docs/runbooks/web-controller-install.md
      - docs/runbooks/web-runtime-stage.md
      - docs/runbooks/staged-web-switch.md
      - docs/operations/web-*.md
permissions:
  contents: read
concurrency:
  group: web-switch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: 24
      - name: Bind evidence to the exact checkout
        id: source-proof
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT_SHA"
          mkdir -p .local/web-switch-controller-smoke
          git show -s --format='checkout=%H%ntree=%T' HEAD > .local/web-switch-controller-smoke/checkout.txt
          printf 'event=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> .local/web-switch-controller-smoke/checkout.txt
      - name: Verify controller and protected asset paths on disposable Linux
        run: sudo env TMPDIR=/root python3 -B -m unittest discover -s deploy/backup -p 'test_web_switch*.py' -v
      - name: Verify offline bootstrap drafts without server access
        run: python3 -B -m unittest discover -s deploy/backup -p 'test_web_bootstrap*.py' -v
      - name: Normalize only synthetic bootstrap Compose without a Docker daemon
        run: python3 -B deploy/backup/web_bootstrap_smoke.py --disposable > .local/web-switch-controller-smoke/bootstrap-draft.json
      - name: Verify inactive controller installation on disposable Linux
        run: sudo env TMPDIR=/root python3 -B -m unittest discover -s deploy/backup -p 'test_web_controller_install*.py' -v
      - name: Rehearse process crashes without touching runtime or real server paths
        run: sudo env TMPDIR=/root python3 -B deploy/backup/web_controller_install_smoke.py --disposable > .local/web-switch-controller-smoke/inactive-install.json
      - name: Verify runtime staging guards without deployment
        run: sudo env TMPDIR=/root python3 -B -m unittest discover -s deploy/backup -p 'test_web_runtime_stage*.py' -v
      - name: Verify opt-in ingress without installing it
        run: node --test scripts/web-switch-ingress.test.mjs scripts/web-switch-transport.test.mjs scripts/web-switch-controller-smoke.test.mjs scripts/web-runtime-stage-smoke.test.mjs scripts/web-bootstrap-preparation.test.mjs
      - name: Verify public archive access without exposing private fixture files
        run: sudo env TMPDIR=/tmp "$(command -v node)" --test scripts/web-switch-fixture-permissions.test.mjs
      - name: Assemble an offline review kit without deployment authority
        run: node scripts/web-bootstrap-preparation.mjs --prepare --host=pilot.xn--c1ajazlh.xn--p1ai
      - name: Prepare only disposable public image bases
        run: |
          docker pull node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
          docker pull nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
      - name: Build one local Web image with advertising disabled
        id: web-image
        run: |
          docker build --file deploy/Dockerfile --target web \
            --build-arg NODE_IMAGE=node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5 \
            --build-arg SOURCE_SHA="$(git rev-parse HEAD)" \
            --tag citygo-web-switch:fixture .
      - name: Rehearse graceful ingress and delayed response transport
        run: |
          node scripts/web-switch-smoke.mjs --disposable \
            --web-image="$(docker image inspect citygo-web-switch:fixture --format '{{.Id}}')" \
            --node-image="$(docker image inspect node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5 --format '{{.Id}}')" \
            --nginx-image="$(docker image inspect nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94 --format '{{.Id}}')" \
            --source-sha="$(git rev-parse HEAD)"
      - name: Reproduce stale idle connection without replaying accepted requests
        if: ${{ !cancelled() && steps.web-image.outcome == 'success' }}
        run: |
          node scripts/web-switch-smoke.mjs --disposable --idle-reuse-regression \
            --web-image="$(docker image inspect citygo-web-switch:fixture --format '{{.Id}}')" \
            --node-image="$(docker image inspect node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5 --format '{{.Id}}')" \
            --nginx-image="$(docker image inspect nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94 --format '{{.Id}}')" \
            --source-sha="$(git rev-parse HEAD)"
      - name: Exercise the whole controller inside its own isolated Docker host
        if: ${{ !cancelled() && steps.source-proof.outcome == 'success' }}
        run: node scripts/web-switch-controller-smoke.mjs --disposable --allow-privileged-fixture --pull-public-bases
      - name: Exercise same-image bootstrap with durable V2 policy
        if: ${{ !cancelled() && steps.source-proof.outcome == 'success' }}
        run: node scripts/web-switch-controller-smoke.mjs --disposable --allow-privileged-fixture --pull-public-bases --durable-v2
      - name: Exercise closed API replacement and same-image Web staging
        if: ${{ !cancelled() && steps.source-proof.outcome == 'success' }}
        run: node scripts/web-switch-controller-smoke.mjs --disposable --allow-privileged-fixture --pull-public-bases --runtime-stage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-switch-rehearsal
          path: |
            .local/web-switch-smoke/
            .local/web-switch-controller-smoke/
            .local/web-bootstrap-preparation/
          retention-days: 7
        # Synthetic data only. No registry publication, deploy credentials,
        # provider calls, runtime installation or autodeploy integration.
